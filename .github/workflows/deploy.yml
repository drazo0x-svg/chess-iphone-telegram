name: Publish iPhone chess training site
# Clean deployment after switching Pages source to GitHub Actions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site and Stockfish 19 Lite
        run: |
          set -eux
          mkdir -p site
          cp index.html app.js benchmark.html benchmark.js benchmark-fixed-v4.js optimize.html optimize-a18-v1.js compare-versions.html compare-versions-v1.js site/
          cp -R multithread site/multithread
          npm install --no-save --prefix /tmp/chess-stockfish stockfish@19.0.1
          npm install --no-save --prefix /tmp/chess-stockfish-18 stockfish@18.0.8
          cp /tmp/chess-stockfish-18/node_modules/stockfish/bin/stockfish-18-lite-single.js site/
          cp /tmp/chess-stockfish-18/node_modules/stockfish/bin/stockfish-18-lite-single.wasm site/
          test -s site/stockfish-18-lite-single.js
          test -s site/stockfish-18-lite-single.wasm
          mkdir -p site/multithread/engine
          cp /tmp/chess-stockfish/node_modules/stockfish/bin/stockfish-19-lite.js site/multithread/engine/
          cp /tmp/chess-stockfish/node_modules/stockfish/bin/stockfish-19-lite.wasm site/multithread/engine/
          test -s site/multithread/engine/stockfish-19-lite.js
          test -s site/multithread/engine/stockfish-19-lite.wasm
          cp /tmp/chess-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.js site/
          cp /tmp/chess-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.wasm site/
          cp /tmp/chess-stockfish/node_modules/stockfish/bin/stockfish-19-asm.js site/
          test -s site/stockfish-19-lite-single.js
          test -s site/stockfish-19-lite-single.wasm
          test -s site/stockfish-19-asm.js
          touch site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
