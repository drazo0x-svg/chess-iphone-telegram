name: Publish iPhone chess training site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site and Stockfish 19 Lite
        run: |
          set -eux
          mkdir -p site
          cp index.html app.js site/
          npm install --no-save --prefix /tmp/chess-stockfish stockfish@19.0.1
          cp /tmp/chess-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.js site/
          cp /tmp/chess-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.wasm site/
          test -s site/stockfish-19-lite-single.js
          test -s site/stockfish-19-lite-single.wasm
          touch site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
